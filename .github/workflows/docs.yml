name: Build and deploy docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The gallery runs in parallel worker processes, which import the real Qt
      # rather than conf.py's mocks: they need a binding and its system libraries.
      # A pull request runs no example, so it needs neither.
      - uses: pyvista/setup-headless-display-action@v4
        if: github.event_name != 'pull_request'
        with:
          qt: true
          pyvista: false
          wm: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -e ".[docs${{ github.event_name != 'pull_request' && ',pyqt6' || '' }}]"
      # The datasets the examples use: MNE sample (1.5 GB) and EEGBCI. Bump the
      # key when MNE moves to a new sample-data version, as a saved cache is
      # never replaced.
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/mne_data/MNE-sample-data
            ~/mne_data/MNE-eegbci-data
          key: mne-docs-data-v1
      # Fetched here, once, so the examples running in parallel only read them:
      # left to the examples, several would download into one folder at once.
      - if: github.event_name != 'pull_request'
        run: >-
          python -c "import mne;
          mne.datasets.sample.data_path(verbose=True);
          mne.datasets.eegbci.load_data(1, [6, 10, 14], update_path=True)"
      # A pull request skips the examples and fails on any warning; main runs
      # every example, four at a time, and deploys.
      - name: Build Sphinx docs
        run: >-
          sphinx-build -b html docs/source docs/_build/html -q -j auto
          ${{ github.event_name == 'pull_request' && '-W --keep-going' || '' }}
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
          MNE_RT_PLOT_GALLERY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: html
          path: docs/_build/html

  # main only: a manual run on another branch builds the full gallery, to try
  # it, without publishing that branch's docs.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write  # pushes the built site to gh-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html
          path: html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: html
          force_orphan: true   # keep gh-pages branch clean (no history)
