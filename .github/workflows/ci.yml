name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  # No branch filter: a stacked pull request targets the branch below it rather
  # than main, and with `branches: ["main"]` those PRs ran no checks at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -e ".[lint]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  pytest:
    name: 'py${{ matrix.python }}'
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # mne-rt's live viz windows need a display even in headless CI
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
          pyvista: false
          wm: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      # gedai is an opt-in extra; install it here so the adaptive multiband GEDAI
      # tests run. pycrostates is test-only: it is the reference the microstates
      # modality is checked against, window by window. The `minimum` job below
      # leaves both out, which exercises mne-rt without them.
      - run: uv pip install -e ".[dev,pyqt6,gedai]" pycrostates
      - run: pytest --cov=mne_rt --cov-report=xml
        env:
          # coverage.py defaults to the sys.monitoring ("sysmon") tracer on
          # Python 3.12+. Force the legacy C tracer, which avoids a separate
          # sysmon interaction with numba jitclass code paths.
          COVERAGE_CORE: ctrace
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success() || failure()

  # The matrix above always resolves the *newest* release of every dependency,
  # so the lower bounds in pyproject.toml are never exercised and can silently
  # drift into fiction. This job installs the oldest version each bound allows.
  minimum:
    name: Minimum deps
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
          pyvista: false
          wm: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          # oldest supported interpreter, to match the oldest dependencies
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install --resolution lowest-direct -e ".[dev,pyqt6]"
      - run: uv pip list
      - run: pytest
        env:
          COVERAGE_CORE: ctrace
