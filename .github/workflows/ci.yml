name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "paper/**"
      - "**.md"
      - "CITATION.cff"
  # No branch filter: a stacked pull request targets the branch below it rather
  # than main, and with `branches: ["main"]` those PRs ran no checks at all.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "paper/**"
      - "**.md"
      - "CITATION.cff"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -e ".[lint]"
      - run: ruff check src
      - run: ruff format --check src

  pytest:
    name: 'py${{ matrix.python }}'
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Codecov upload by OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        # Coverage on one job only: the C tracer slows the suite.
        include:
          - python: "3.12"
            coverage: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # mne-rt's live viz windows need a display even in headless CI
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
          pyvista: false
          wm: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      # gedai is opt-in; pycrostates is the microstates reference. The `minimum`
      # job leaves both out.
      - run: uv pip install -e ".[dev,pyqt6,gedai]" pycrostates
      # fsaverage, fetched by the source-space tests.
      - uses: actions/cache@v4
        with:
          path: ~/mne_data/MNE-fsaverage-data
          key: mne-fsaverage-v1
      - run: pytest --durations=20 ${{ matrix.coverage && '--cov=mne_rt --cov-report=xml' || '' }}
        env:
          # The legacy C tracer: sys.monitoring, the 3.12+ default, interacts
          # badly with numba jitclass code.
          COVERAGE_CORE: ctrace
      - uses: codecov/codecov-action@v5
        if: matrix.coverage && (success() || failure())
        with:
          # A fork's pull request gets no OIDC token; Codecov takes it tokenless.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: coverage.xml
          disable_search: true

  # The matrix above always resolves the *newest* release of every dependency,
  # so the lower bounds in pyproject.toml are never exercised and can silently
  # drift into fiction. This job installs the oldest version each bound allows.
  minimum:
    name: Minimum deps
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
          pyvista: false
          wm: false
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          # oldest supported interpreter, to match the oldest dependencies
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install --resolution lowest-direct -e ".[dev,pyqt6]"
      - run: uv pip list
      # fsaverage, fetched by the source-space tests.
      - uses: actions/cache@v4
        with:
          path: ~/mne_data/MNE-fsaverage-data
          key: mne-fsaverage-v1
      - run: pytest --durations=20
